<!doctype html>
<!-- Banner source: 620 x 280 CSS pixels, rendered at 2x. Existing Ko-fi button artwork is scaled proportionally, without modification. -->
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:620px;height:280px;background:transparent}
:root{--bg:#FFF3F3;--edge:#F0CDCF;--ink:#183D56;--muted:#654D58;--warm:#FF777F}
body.dark{--bg:#30232D;--edge:#77505E;--ink:#FFF9F6;--muted:#E8CDD4;--warm:#FF8E97}
.card{width:620px;height:280px;border:1.5px solid var(--edge);border-radius:24px;background:var(--bg);font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;position:relative;overflow:hidden}
.heading{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:12px;background:#FFFDF7}
h1{font-size:36px;line-height:1.2;font-weight:650;letter-spacing:-.6px;color:var(--ink);margin:0}
p{font-size:22px;line-height:1.3;color:var(--muted);margin:0}
.button{width:360px;height:auto;display:block;position:relative}
.spark{position:absolute;background:var(--warm);border-radius:50%;width:12px;height:12px;top:30px;right:36px}.spark.two{width:7px;height:7px;left:32px;top:auto;bottom:32px}
</style></head><body><div class="card"><i class="spark"></i><i class="spark two"></i><div class="heading"><img class="mark" src="focusrecall-icon.png" alt=""><h1>Enjoying FocusRecall?</h1></div><p>A little appreciation, if you’d like. Thank you!</p><img class="button" src="support-kofi.png" alt="Support me on Ko-fi"></div><script>if(new URLSearchParams(location.search).get('theme')==='dark')document.body.classList.add('dark')</script></body></html>

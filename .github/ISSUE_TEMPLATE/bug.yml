name: Bug report
description: Report a reproducible problem using fictional examples.
body:
  - type: markdown
    attributes:
      value: Do not attach your database, vault, window-title history or private notes. Use fictional examples and redact screenshots.
  - type: input
    id: version
    attributes:
      label: A14 Pomodoro version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant details
      description: Timer mode, study-day boundary, theme/scale, or whether this followed an update. Include only nonprivate details.

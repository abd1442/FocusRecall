name: Report a problem
description: Describe a reproducible Learnalyt problem without private data.
body:
  - type: markdown
    attributes:
      value: Never attach a database, vault, backup, credentials or private screenshots. Request a private channel for security concerns.
  - type: input
    id: version
    attributes:
      label: Learnalyt and Windows versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps using fictional data
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior

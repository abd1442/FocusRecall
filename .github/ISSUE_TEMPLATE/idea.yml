name: Suggest an improvement
description: Help make FocusRecall more useful for studying.
body:
  - type: textarea
    id: need
    attributes:
      label: What were you trying to do?
      placeholder: Describe your study workflow and what got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      placeholder: An example is welcome. Leave private notes and records out.

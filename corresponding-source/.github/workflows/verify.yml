name: Verify Windows source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache headers for the native Windows sampler
        shell: pwsh
        run: |
          $version = node -p "process.versions.node"
          $cache = Join-Path $env:RUNNER_TEMP 'focusrecall-node-headers'
          node node_modules/node-gyp/bin/node-gyp.js install --target=$version --devdir=$cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FOCUSRECALL_NODE_HEADERS=$(Join-Path $cache $version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: node scripts/generate-ipc-schema.cjs --check
      - run: node scripts/prepare-legal.cjs --check
      - run: node scripts/localization/installer-copy.cjs --check
      - run: npm run localization:check
      - run: npm test
      - run: npm run build
      - run: node scripts/check-repository.cjs --strict-paths
      - run: npm audit
      - run: node scripts/publication.mjs --check
      # No release upload, signing credentials or automatic publication.
